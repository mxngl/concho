name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Forbidden content
        run: python scripts/check_forbidden.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,stv,schedule]"

      - name: Lint
        run: ruff check .

      - name: project_config schema drift
        run: python scripts/export_config_schema.py --check

      - name: Test
        run: pytest

  reference:
    # P2.1: golden / equivalence tests on the Island 2026 reference fixtures (public repos
    # cloned at island-2026-final / 989a6b7, checksums verified). Missing fixtures fail
    # instead of skip here; course-workbook tests (COURSE_STV_XLSX) still skip.
    # P3B.8: pandas 2.3.3 via constraints file, because the equivalence test runs the
    # original IPD scripts, which fail on pandas 3; that test must never be skipped here.
    runs-on: ubuntu-latest
    env:
      CONCHO_FIXTURES_DIR: ${{ github.workspace }}/.fixtures
      CONCHO_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c ci/constraints-pandas2.txt -e ".[dev,stv,schedule]"

      - name: Require pandas 2 (original IPD scripts)
        run: |
          python -c "import sys, pandas; print('pandas', pandas.__version__); sys.exit(int(pandas.__version__.split('.')[0]) >= 3)"

      - name: Fetch reference fixtures
        run: python scripts/fetch_fixtures.py

      - name: Test (incl. golden and equivalence tests)
        run: pytest

  pipeline:
    # P5.2: the Tier-1 team pipeline (scripts/run_pipeline.py) on template/ + invented data
    # (tests/fixtures/pipeline_team/), with concho installed NON-editable like a team repo's
    # pipeline.yml does, so missing package data shows up here. No course workbook: STV is
    # skipped with a note (the tests check that note).
    runs-on: ubuntu-latest
    env:
      CONCHO_PIPELINE_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (non-editable)
        run: |
          python -m pip install --upgrade pip
          pip install ".[stv,dev]"

      - name: Test the team pipeline
        run: pytest tests/pipeline

  revit-addin:
    # P4.2: build the Revit add-in for every supported Revit version (build only, no Revit
    # installed; the Revit API comes from the Nice3point reference packages).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ["R25", "R26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (Revit ${{ matrix.revit }})
        run: dotnet build revit-addin/Concho.QTO.sln -c "Release ${{ matrix.revit }}"

  reference-pandas3:
    # P3B.8: the schedule golden and pipeline tests on pandas 3 (the equivalence test needs
    # pandas 2 for the original scripts and runs in the job `reference`).
    runs-on: ubuntu-latest
    env:
      CONCHO_FIXTURES_DIR: ${{ github.workspace }}/.fixtures
      CONCHO_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,stv,schedule]" "pandas>=3,<4"

      - name: Require pandas 3
        run: |
          python -c "import sys, pandas; print('pandas', pandas.__version__); sys.exit(int(pandas.__version__.split('.')[0]) < 3)"

      - name: Fetch reference fixtures
        run: python scripts/fetch_fixtures.py

      - name: Test (schedule golden + pipeline)
        run: pytest tests/schedule/test_schedule_golden.py tests/schedule/test_schedule_pipeline.py