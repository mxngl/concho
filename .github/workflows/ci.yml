name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Forbidden content
        run: python scripts/check_forbidden.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,stv,schedule]"

      - name: Lint
        run: ruff check .

      - name: project_config schema drift
        run: python scripts/export_config_schema.py --check

      - name: Test
        run: pytest

  reference:
    # P2.1: golden / equivalence tests on the Island 2026 reference fixtures (public repos
    # cloned at island-2026-final / 989a6b7, checksums verified). Missing fixtures fail
    # instead of skip here; course-workbook tests (COURSE_STV_XLSX) still skip.
    runs-on: ubuntu-latest
    env:
      CONCHO_FIXTURES_DIR: ${{ github.workspace }}/.fixtures
      CONCHO_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,stv,schedule]"

      - name: Fetch reference fixtures
        run: python scripts/fetch_fixtures.py

      - name: Test (incl. golden and equivalence tests)
        run: pytest
