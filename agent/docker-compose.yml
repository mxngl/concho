# Concho agent bundle (roadmap P6.6): n8n + Postgres + data API (+ Discord bot).
#
#   cp agent/.env.example agent/.env      # fill in; never commit
#   scripts/import_workflows.sh --config path/to/team-repo/project_config.json
#   docker compose -f agent/docker-compose.yml --profile discord up -d     # with the bot
#
# Nothing here is published to the internet: Postgres, the data API and the bot have no ports;
# n8n's port is bound to 127.0.0.1 (N8N_BIND_ADDRESS). The bot reaches the webhook over the
# compose network (http://n8n:5678/webhook/<CONCHO_WEBHOOK_PATH>) and n8n posts the reply to
# Discord itself, so no inbound connection from Discord is needed.
# Hosting (D2) is a separate decision; this file is for a laptop or one VPS.

name: concho

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      POSTGRES_DB: ${POSTGRES_DB:-concho}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # first start only: creates the memory table before n8n can (P6.4)
      - ./sql/memory.sql:/docker-entrypoint-initdb.d/10-memory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Retention of the conversation memory (P6.4): daily delete of messages older than
  # CONCHO_MEMORY_RETENTION_DAYS (default 30). Also (re)applies memory.sql at start.
  memory-purge:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-concho}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      PGDATABASE: ${POSTGRES_DB:-concho}
      RETENTION_DAYS: ${CONCHO_MEMORY_RETENTION_DAYS:-30}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -q -v ON_ERROR_STOP=1 -f /sql/memory.sql
        while true; do
          psql -q -v ON_ERROR_STOP=1 -v retention_days="$$RETENTION_DAYS" -f /sql/memory_purge.sql || true
          sleep 86400
        done

  # The data API (engines/api, P5.4) on a team repo's results/. Not exposed: only n8n calls it.
  data-api:
    build:
      context: ..
      dockerfile: agent/Dockerfile.api
    restart: unless-stopped
    environment:
      CONCHO_API_TOKEN: ${CONCHO_API_TOKEN:?set CONCHO_API_TOKEN in agent/.env}
    volumes:
      # a team repo with results/index.json (relative paths are relative to agent/)
      - ${CONCHO_TEAM_REPO:?set CONCHO_TEAM_REPO in agent/.env}:/team:ro
      - apidata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      data-api:
        condition: service_healthy
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-concho}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-concho}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in agent/.env}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      # the workflows read these with $env (docs/agent.md)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      CONCHO_API_URL: ${CONCHO_API_URL:-http://data-api:8000}
      CONCHO_API_TOKEN: ${CONCHO_API_TOKEN:?set CONCHO_API_TOKEN in agent/.env}
      CONCHO_MODEL_ROUTER: ${CONCHO_MODEL_ROUTER:-gpt-4o-mini}
      CONCHO_MODEL_SUBAGENT: ${CONCHO_MODEL_SUBAGENT:-gpt-4o-mini}
      CONCHO_MODEL_TTS: ${CONCHO_MODEL_TTS:-gpt-4o-mini-tts}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID_DEBUG: ${DISCORD_CHANNEL_ID_DEBUG:-}
    volumes:
      - n8ndata:/home/node/.n8n
      # rendered by scripts/render_agent.py (run by scripts/import_workflows.sh)
      - ./build:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  # Discord bot: forwards messages to the n8n webhook, ignores the response (n8n replies).
  # Needs a real bot token, so it only starts with:  --profile discord
  bot:
    profiles: ["discord"]
    build:
      context: ./bot
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    # (a missing value is reported by the bot at start, so `compose up` works without Discord)
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID_ASK: ${DISCORD_CHANNEL_ID_ASK:-}
      CONCHO_WEBHOOK_URL: http://n8n:5678/webhook/${CONCHO_WEBHOOK_PATH:-}
      CONCHO_WEBHOOK_TOKEN: ${CONCHO_WEBHOOK_TOKEN:-}

volumes:
  pgdata:
  n8ndata:
  apidata:
