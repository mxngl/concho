# Concho deployment bundle (roadmap P6.6): n8n, Postgres, the Discord bot and the data API.
#
#   cp agent/.env.example agent/.env      # fill in (never commit)
#   docker compose -f agent/docker-compose.yml --env-file agent/.env up -d --build
#   scripts/import_workflows.sh           # renders + imports the workflows and credentials
#
# Network layout: only n8n's editor/webhook port is published, and only on 127.0.0.1. The data
# API and Postgres are on an internal network (no published port, no outbound internet).
# See docs/agent.md ("Deployment bundle") for the local test.

name: concho

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in agent/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  # P6.4: creates the chat-memory table (memory.sql, idempotent) and purges messages older than
  # CONCHO_MEMORY_RETENTION_DAYS once a day.
  memory-maintenance:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in agent/.env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      PGDATABASE: ${POSTGRES_DB:-n8n}
      CONCHO_MEMORY_RETENTION_DAYS: ${CONCHO_MEMORY_RETENTION_DAYS:-30}
    volumes:
      - ./memory.sql:/memory.sql:ro
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -q -f /memory.sql
        while true; do
          psql -v ON_ERROR_STOP=1 -tA -c "SELECT 'memory purge: ' || concho_purge_chat_history($${CONCHO_MEMORY_RETENTION_DAYS}) || ' messages deleted'"
          sleep 86400
        done
    networks: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in agent/.env (the n8n release the workflows were tested on)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      memory-maintenance:
        condition: service_started
      data-api:
        condition: service_healthy
    ports:
      # editor and webhooks on this machine only; put a reverse proxy in front for anything else
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?set POSTGRES_USER in agent/.env}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in agent/.env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in agent/.env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      # the workflows read their settings with $env in expressions
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # keep execution logs (they contain chat text) as long as the chat memory, no telemetry
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # read by concho.json / error-handler.json
      CONCHO_API_URL: ${CONCHO_API_URL:-http://data-api:8000}
      CONCHO_API_TOKEN: ${CONCHO_API_TOKEN:?set CONCHO_API_TOKEN in agent/.env}
      CONCHO_MODEL_ROUTER: ${CONCHO_MODEL_ROUTER:-gpt-4o-mini}
      CONCHO_MODEL_SUBAGENT: ${CONCHO_MODEL_SUBAGENT:-gpt-4o-mini}
      CONCHO_MODEL_TTS: ${CONCHO_MODEL_TTS:-gpt-4o-mini-tts}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID_DEBUG: ${DISCORD_CHANNEL_ID_DEBUG:-}
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [default, backend]

  discord-bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in agent/.env}
      DISCORD_CHANNEL_ID_ASK: ${DISCORD_CHANNEL_ID_ASK:?set DISCORD_CHANNEL_ID_ASK in agent/.env}
      # the bot POSTs here and ignores the response body; n8n posts the reply to Discord
      CONCHO_WEBHOOK_URL: http://n8n:5678/webhook/${CONCHO_WEBHOOK_PATH:?set CONCHO_WEBHOOK_PATH in agent/.env}
      CONCHO_WEBHOOK_TOKEN: ${CONCHO_WEBHOOK_TOKEN:?set CONCHO_WEBHOOK_TOKEN in agent/.env}
    networks: [default]

  # P5.4: `concho-api serve`, one tenant per team repo. No published port: only n8n reaches it.
  data-api:
    build:
      context: ..
      dockerfile: agent/api/Dockerfile
    restart: unless-stopped
    environment:
      CONCHO_API_TOKEN: ${CONCHO_API_TOKEN:?set CONCHO_API_TOKEN in agent/.env}
    volumes:
      # a team repo with results/index.json (read-only); the SQLite db is built in the volume
      - ${CONCHO_TEAM_REPO:?set CONCHO_TEAM_REPO in agent/.env (path of the team repo)}:/team:ro
      - data-api-db:/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

networks:
  default: {}
  # no route to the outside: Postgres and the data API never need the internet
  backend:
    internal: true

volumes:
  postgres-data:
  n8n-data:
  data-api-db:
