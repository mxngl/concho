# Concho evaluation questions (roadmap P6.8).
#
# Templates and recipes only: NO expected numbers are written here. scripts/eval_questions.py
# resolves the {placeholders} (entities) and the expected numbers (facts) from the results of one
# snapshot, i.e. from the data API's SQLite database built from the team repo
# (`concho-api ingest`). Nothing in this file is course or RSMeans-derived data.
#
# entity: sql returning one value (column 1 of row `row`, default the first); names are used as
#         {name} in question texts and as :name in other SQL. :sid is the snapshot id.
# fact:   the expected number, `sql` (column 1 of the first row) or `api` (a query function of
#         engines/api/queries.py: the same code the agent's tools run on, for scenarios).
#         kind: count (must match exactly) | amount (default, within 1 %); abs: ignore the sign.
# question: id, group, lang (en|de|es|pl), category (what the router should answer, scored
#         separately), text, expect (fact names), expect_text (names that must appear), tools
#         (none|some), after (id of the question before it in the same chat: a follow-up),
#         tier (2 = schedule: skipped until P6.5).
# A question whose entities/facts cannot be resolved for the snapshot (no STV result, no second
# snapshot, ...) is reported as unavailable and not scored.

version: 1

entities:
  # --- cost
  top_cluster:
    sql: "SELECT cluster FROM tvd_clusters WHERE snapshot_id=:sid ORDER BY estimate DESC, cluster"
  second_cluster:
    sql: "SELECT cluster FROM tvd_clusters WHERE snapshot_id=:sid ORDER BY estimate DESC, cluster"
    row: 1
  top_ac3:  # the biggest Assembly Code group (3 characters, e.g. B10) by line item total
    sql: >-
      SELECT substr(upper(ac),1,3) FROM tvd_line_items WHERE snapshot_id=:sid AND ac<>''
      GROUP BY substr(upper(ac),1,3) ORDER BY SUM(total) DESC, 1
  # --- carbon
  top_assembly:
    sql: >-
      SELECT assembly FROM stv_items WHERE snapshot_id=:sid GROUP BY assembly
      ORDER BY SUM(carbon) DESC, assembly
  second_assembly:
    sql: >-
      SELECT assembly FROM stv_items WHERE snapshot_id=:sid GROUP BY assembly
      ORDER BY SUM(carbon) DESC, assembly
    row: 1
  top_material:
    sql: >-
      SELECT material_type FROM stv_items WHERE snapshot_id=:sid GROUP BY material_type
      ORDER BY SUM(carbon) DESC, material_type
  swap_material:  # the lowest-carbon material in the project with the same unit as top_material
    sql: >-
      SELECT material_type FROM stv_items WHERE snapshot_id=:sid AND carbon_per_unit IS NOT NULL
      AND lower(material_type)<>lower(:top_material)
      AND unit=(SELECT unit FROM stv_items WHERE snapshot_id=:sid AND material_type=:top_material LIMIT 1)
      GROUP BY material_type HAVING COUNT(DISTINCT round(carbon_per_unit,9))=1
      ORDER BY MIN(carbon_per_unit), material_type
  # --- quantities
  category_main:  # the category with the most counted elements
    sql: >-
      SELECT category FROM elements WHERE snapshot_id=:sid AND dnc=0 AND category<>''
      GROUP BY category ORDER BY COUNT(*) DESC, category
  level_a:  # the two levels with the most elements of that category
    sql: >-
      SELECT level FROM elements WHERE snapshot_id=:sid AND dnc=0 AND level<>''
      AND lower(category)=lower(:category_main) GROUP BY level ORDER BY COUNT(*) DESC, level
  level_b:
    sql: >-
      SELECT level FROM elements WHERE snapshot_id=:sid AND dnc=0 AND level<>''
      AND lower(category)=lower(:category_main) GROUP BY level ORDER BY COUNT(*) DESC, level
    row: 1
  category_area:
    sql: >-
      SELECT category FROM quantity_summary WHERE snapshot_id=:sid GROUP BY category
      HAVING SUM(area_sf)>0 ORDER BY SUM(area_sf) DESC, category
  category_length:
    sql: >-
      SELECT category FROM quantity_summary WHERE snapshot_id=:sid GROUP BY category
      HAVING SUM(length_lf)>0 ORDER BY SUM(length_lf) DESC, category
  category_volume:
    sql: >-
      SELECT category FROM quantity_summary WHERE snapshot_id=:sid GROUP BY category
      HAVING SUM(volume_cf)>0 ORDER BY SUM(volume_cf) DESC, category
  element_ac3:  # the biggest Assembly Code group among the counted elements
    sql: >-
      SELECT substr(upper(assembly_code),1,3) FROM elements WHERE snapshot_id=:sid AND dnc=0
      AND assembly_code<>'' GROUP BY substr(upper(assembly_code),1,3) ORDER BY COUNT(*) DESC, 1

facts:
  # --- cost
  cost_total: {sql: "SELECT tvd_grand_total FROM snapshots WHERE snapshot_id=:sid"}
  cost_target: {sql: "SELECT tvd_target FROM snapshots WHERE snapshot_id=:sid"}
  cost_gap:
    sql: "SELECT tvd_grand_total - tvd_target FROM snapshots WHERE snapshot_id=:sid"
    abs: true
  cost_per_sf:
    sql: "SELECT tvd_grand_total / gross_sf FROM snapshots WHERE snapshot_id=:sid AND gross_sf > 0"
  top_cluster_estimate:
    sql: "SELECT estimate FROM tvd_clusters WHERE snapshot_id=:sid AND cluster=:top_cluster"
  second_cluster_estimate:
    sql: "SELECT estimate FROM tvd_clusters WHERE snapshot_id=:sid AND cluster=:second_cluster"
  ac_total:
    sql: >-
      SELECT SUM(total) FROM tvd_line_items WHERE snapshot_id=:sid
      AND substr(upper(ac),1,3)=upper(:top_ac3)
  unmapped_elements:
    kind: count
    sql: >-
      SELECT value FROM data_quality WHERE snapshot_id=:sid AND scope='tvd'
      AND metric='unmapped_elements'
  roof_plus_10_total:
    api: {fn: cost_what_if, args: {ac: B30, change_pct: 10}, pick: grand_total_after}
  roof_plus_10_gap:
    api: {fn: cost_what_if, args: {ac: B30, change_pct: 10}, pick: delta_to_target_after}
    abs: true
  top_ac_minus_15_total:
    api: {fn: cost_what_if, args: {ac: "{top_ac3}", change_pct: -15}, pick: grand_total_after}
  # --- carbon (STV)
  carbon_life_cycle: {sql: "SELECT stv_carbon_life_cycle FROM snapshots WHERE snapshot_id=:sid"}
  carbon_embodied: {sql: "SELECT stv_carbon_embodied FROM snapshots WHERE snapshot_id=:sid"}
  carbon_target: {sql: "SELECT stv_carbon_target FROM snapshots WHERE snapshot_id=:sid"}
  carbon_use_phase:
    sql: "SELECT use_phase FROM stv_summary WHERE snapshot_id=:sid AND metric='carbon'"
  water_life_cycle:
    sql: "SELECT project FROM stv_summary WHERE snapshot_id=:sid AND metric='water'"
  top_assembly_carbon:
    sql: "SELECT SUM(carbon) FROM stv_items WHERE snapshot_id=:sid AND assembly=:top_assembly"
  second_assembly_carbon:
    sql: "SELECT SUM(carbon) FROM stv_items WHERE snapshot_id=:sid AND assembly=:second_assembly"
  top_material_carbon:
    sql: "SELECT SUM(carbon) FROM stv_items WHERE snapshot_id=:sid AND material_type=:top_material"
  swap_life_cycle_after:
    api:
      fn: carbon_what_if
      args: {material_from: "{top_material}", material_to: "{swap_material}"}
      pick: life_cycle_after
  # --- quantities
  elements_total:
    kind: count
    sql: >-
      SELECT COUNT(*) FROM elements WHERE snapshot_id=:sid AND dnc=0
      HAVING COUNT(*) > 0
  count_category:
    kind: count
    sql: >-
      SELECT COUNT(*) FROM elements WHERE snapshot_id=:sid AND dnc=0
      AND lower(category)=lower(:category_main)
  count_level_a:
    kind: count
    sql: >-
      SELECT COUNT(*) FROM elements WHERE snapshot_id=:sid AND dnc=0
      AND lower(category)=lower(:category_main) AND lower(level)=lower(:level_a)
  count_level_b:
    kind: count
    sql: >-
      SELECT COUNT(*) FROM elements WHERE snapshot_id=:sid AND dnc=0
      AND lower(category)=lower(:category_main) AND lower(level)=lower(:level_b)
  count_ac_level_a:
    kind: count
    sql: >-
      SELECT COUNT(*) FROM elements WHERE snapshot_id=:sid AND dnc=0
      AND substr(upper(assembly_code),1,3)=upper(:element_ac3) AND lower(level)=lower(:level_a)
  area_category:
    sql: >-
      SELECT SUM(area_sf) FROM quantity_summary WHERE snapshot_id=:sid
      AND lower(category)=lower(:category_area)
  length_category:
    sql: >-
      SELECT SUM(length_lf) FROM quantity_summary WHERE snapshot_id=:sid
      AND lower(category)=lower(:category_length)
  volume_category:
    sql: >-
      SELECT SUM(volume_cf) FROM quantity_summary WHERE snapshot_id=:sid
      AND lower(category)=lower(:category_volume)
  # --- general
  snapshots_count:
    kind: count
    sql: "SELECT COUNT(*) FROM snapshots"
  missing_level:
    kind: count
    sql: >-
      SELECT value FROM data_quality WHERE snapshot_id=:sid AND scope='elements'
      AND metric='missing_level'
  cost_change_vs_previous:
    api: {fn: compare, pick: cost.change}
    abs: true

questions:
  # ------------------------------------------------------------------ cost
  - {id: cost-total, group: cost, lang: en, category: COST, expect: [cost_total],
     text: "What is the total project cost right now?"}
  - {id: cost-target-gap, group: cost, lang: en, category: COST, expect: [cost_target, cost_gap],
     text: "What is our cost target and how far are we from it?"}
  - {id: cost-per-sf, group: cost, lang: en, category: COST, expect: [cost_per_sf],
     text: "What is the cost per square foot of the building?"}
  - {id: cost-top-cluster, group: cost, lang: en, category: COST,
     expect: [top_cluster_estimate], expect_text: ["{top_cluster}"],
     text: "Which cost cluster is the most expensive, and what does it cost?"}
  - {id: cost-cluster, group: cost, lang: en, category: COST, expect: [second_cluster_estimate],
     text: "What is the estimate for the {second_cluster} cluster?"}
  - {id: cost-ac, group: cost, lang: en, category: COST, expect: [ac_total],
     text: "How much do all line items with Assembly Code {top_ac3} cost in total?"}
  - {id: cost-unmapped, group: cost, lang: en, category: COST, expect: [unmapped_elements],
     text: "How many elements are not priced because they have no Assembly Code?"}
  # ------------------------------------------------------------------ what-if
  - {id: whatif-roof, group: what-if, lang: en, category: COST,
     expect: [roof_plus_10_total, roof_plus_10_gap],
     text: "What happens to the total cost if the roof costs 10% more?"}
  - {id: whatif-top-ac, group: what-if, lang: en, category: COST, expect: [top_ac_minus_15_total],
     text: "What would the grand total be if everything with Assembly Code {top_ac3} got 15% cheaper?"}
  - {id: whatif-material, group: what-if, lang: en, category: CARBON, expect: [swap_life_cycle_after],
     text: "What if we replaced all {top_material} with {swap_material}? What would the life cycle carbon be?"}
  # ------------------------------------------------------------------ carbon
  - {id: carbon-life-cycle, group: carbon, lang: en, category: CARBON, expect: [carbon_life_cycle],
     text: "What is the life cycle carbon of the project in kgCO2e?"}
  - {id: carbon-embodied, group: carbon, lang: en, category: CARBON, expect: [carbon_embodied],
     text: "How much embodied carbon does the building have?"}
  - {id: carbon-target, group: carbon, lang: en, category: CARBON,
     expect: [carbon_target, carbon_life_cycle],
     text: "How does our carbon compare to the sustainability target?"}
  - {id: carbon-top-assembly, group: carbon, lang: en, category: CARBON,
     expect: [top_assembly_carbon], expect_text: ["{top_assembly}"],
     text: "Which assembly has the highest embodied carbon, and how much is it?"}
  - {id: carbon-use-phase, group: carbon, lang: en, category: CARBON, expect: [carbon_use_phase],
     text: "How much of the carbon comes from the use phase?"}
  - {id: carbon-material, group: carbon, lang: en, category: CARBON, expect: [top_material_carbon],
     text: "How much embodied carbon comes from {top_material}?"}
  - {id: carbon-water, group: carbon, lang: en, category: CARBON, expect: [water_life_cycle],
     text: "What is the life cycle water use of the project?"}
  # ------------------------------------------------------------------ quantities
  - {id: qty-total, group: quantities, lang: en, category: QUANTITY, expect: [elements_total],
     text: "How many elements are in the model in total?"}
  - {id: qty-category, group: quantities, lang: en, category: QUANTITY, expect: [count_category],
     text: "How many {category_main} are in the model?"}
  - {id: qty-level, group: quantities, lang: en, category: QUANTITY, expect: [count_level_a],
     text: "How many {category_main} are on {level_a}?"}
  - {id: qty-area, group: quantities, lang: en, category: QUANTITY, expect: [area_category],
     text: "What is the total area of {category_area} in square feet?"}
  - {id: qty-length, group: quantities, lang: en, category: QUANTITY, expect: [length_category],
     text: "What is the total length of {category_length} in linear feet?"}
  - {id: qty-volume, group: quantities, lang: en, category: QUANTITY, expect: [volume_category],
     text: "What is the total volume of {category_volume} in cubic feet?"}
  - {id: qty-ac-level, group: quantities, lang: en, category: QUANTITY, expect: [count_ac_level_a],
     text: "How many elements with Assembly Code {element_ac3} are on {level_a}?"}
  # ------------------------------------------------------------------ general
  - {id: gen-overview, group: general, lang: en, category: GENERAL, expect: [cost_total],
     text: "Give me a quick overview of where the project stands."}
  - {id: gen-snapshots, group: general, lang: en, category: GENERAL, expect: [snapshots_count],
     text: "How many snapshots do we have so far?"}
  - {id: gen-missing-level, group: general, lang: en, category: GENERAL, expect: [missing_level],
     text: "How many elements are missing a level in the data?"}
  - {id: gen-compare, group: general, lang: en, category: GENERAL, expect: [cost_change_vs_previous],
     text: "By how much did the total cost change between the last two snapshots?"}
  # ------------------------------------------------------------------ German
  - {id: de-cost-total, group: multilingual, lang: de, category: COST, expect: [cost_total],
     text: "Wie hoch sind die Gesamtkosten des Projekts?"}
  - {id: de-carbon, group: multilingual, lang: de, category: CARBON, expect: [carbon_life_cycle],
     text: "Wie hoch sind die Lebenszyklus-Emissionen des Gebäudes in kgCO2e?"}
  - {id: de-qty, group: multilingual, lang: de, category: QUANTITY, expect: [count_level_a],
     text: "Wie viele {category_main} gibt es auf {level_a}?"}
  - {id: de-whatif, group: multilingual, lang: de, category: COST,
     expect: [roof_plus_10_total],
     text: "Was passiert mit den Gesamtkosten, wenn das Dach 10 % teurer wird?"}
  # ------------------------------------------------------------------ Spanish
  - {id: es-cost-target, group: multilingual, lang: es, category: COST, expect: [cost_target, cost_gap],
     text: "¿Cuál es el objetivo de costo y cuánto nos falta o nos sobra?"}
  - {id: es-qty, group: multilingual, lang: es, category: QUANTITY, expect: [count_category],
     text: "¿Cuántos {category_main} hay en total en el modelo?"}
  - {id: es-carbon, group: multilingual, lang: es, category: CARBON, expect: [carbon_embodied],
     text: "¿Cuál es el carbono incorporado del proyecto?"}
  # ------------------------------------------------------------------ Polish
  - {id: pl-cost-total, group: multilingual, lang: pl, category: COST, expect: [cost_total],
     text: "Jaki jest całkowity koszt projektu?"}
  - {id: pl-qty, group: multilingual, lang: pl, category: QUANTITY, expect: [count_level_a],
     text: "Ile jest elementów {category_main} na {level_a}?"}
  - {id: pl-carbon, group: multilingual, lang: pl, category: CARBON, expect: [carbon_life_cycle],
     text: "Jaki jest całkowity ślad węglowy budynku w cyklu życia?"}
  # ------------------------------------------------------------------ follow-ups (same chat)
  - {id: fu-qty-1, group: follow-up, lang: en, category: QUANTITY, expect: [count_level_a],
     text: "How many {category_main} are on {level_a}?"}
  - {id: fu-qty-2, group: follow-up, lang: en, category: QUANTITY, expect: [count_level_b],
     after: fu-qty-1, text: "And on {level_b}?"}
  - {id: fu-cost-1, group: follow-up, lang: en, category: COST, expect: [top_cluster_estimate],
     text: "What is the estimate for the {top_cluster} cluster?"}
  - {id: fu-cost-2, group: follow-up, lang: en, category: COST, expect: [second_cluster_estimate],
     after: fu-cost-1, text: "And for {second_cluster}?"}
  - {id: fu-de-1, group: follow-up, lang: de, category: QUANTITY, expect: [count_level_a],
     text: "Wie viele {category_main} gibt es auf {level_a}?"}
  - {id: fu-de-2, group: follow-up, lang: de, category: QUANTITY, expect: [count_level_b],
     after: fu-de-1, text: "Und auf {level_b}?"}
  - {id: fu-carbon-1, group: follow-up, lang: en, category: CARBON, expect: [top_assembly_carbon],
     text: "How much embodied carbon does the {top_assembly} assembly have?"}
  - {id: fu-carbon-2, group: follow-up, lang: en, category: CARBON, expect: [second_assembly_carbon],
     after: fu-carbon-1, text: "And the {second_assembly} assembly?"}
  # ------------------------------------------------------------------ out of scope
  - {id: oos-weather, group: out-of-scope, lang: en, category: OTHER, tools: none,
     text: "What will the weather be like tomorrow?"}
  - {id: oos-joke, group: out-of-scope, lang: en, category: OTHER, tools: none,
     text: "Tell me a joke about architects."}
  - {id: oos-capital, group: out-of-scope, lang: es, category: OTHER, tools: none,
     text: "¿Cuál es la capital de Francia?"}
  - {id: oos-code, group: out-of-scope, lang: en, category: OTHER, tools: none,
     text: "Write a Python script that sorts a list of numbers."}
  # ------------------------------------------------------------------ schedule (tier 2, skipped)
  - {id: sched-day, group: schedule, lang: en, category: SCHEDULE, tier: 2,
     text: "What is happening on Level 1 on December 15?"}
  - {id: sched-complete, group: schedule, lang: en, category: SCHEDULE, tier: 2,
     text: "When is the superstructure complete?"}
  - {id: sched-deliveries, group: schedule, lang: en, category: SCHEDULE, tier: 2,
     text: "How many deliveries are planned in week 12?"}
  - {id: sched-takt, group: schedule, lang: de, category: SCHEDULE, tier: 2,
     text: "In welcher Takt-Zone arbeitet die Rohbau-Kolonne auf Ebene 2?"}
