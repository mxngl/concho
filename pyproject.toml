[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concho"
version = "0.0.0"
description = "AI project agent and TVD/STV/schedule engines for AEC Global Teamwork teams (prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Nagel" },
    { name = "Ashmitha Jaysi Sivakumar" },
]
# No license declared yet: decision D4 is pending (see docs/decisions.md).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
stv = [
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]

[project.scripts]
concho-stv = "engines.stv.cli:main"
concho-tvd = "engines.tvd.cli:main"

[project.urls]
Repository = "https://github.com/mxngl/concho"

# src-less layout: only the `engines` and `dashboards` packages are importable.
[tool.setuptools.packages.find]
include = ["engines", "engines.*", "dashboards", "dashboards.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# P1.2: the STV engine is kept as a verbatim port of IPD_Challenge@989a6b7 so the diff
# against the source stays reviewable; lint cleanup of these rules is left for Phase 3.
"engines/stv/*.py" = ["E501", "I001", "UP017", "UP035", "UP037", "B905", "F841", "W293"]
# Verbatim copy of the AutoTVD HTML f-string (P1.3); replaced by a static page in P7.1.
"dashboards/tvd/legacy_render.py" = ["E501", "W605"]

[tool.ruff.lint.isort]
known-first-party = ["engines", "dashboards", "check_forbidden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
