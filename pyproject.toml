[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concho"
version = "0.0.0"
description = "AI project agent and TVD/STV/schedule engines for AEC Global Teamwork teams (prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Nagel" },
    { name = "Ashmitha Jaysi Sivakumar" },
]
# No license declared yet: decision D4 is pending (see docs/decisions.md).
# P3.1: pydantic for the project_config schema (engines/common/config.py).
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
stv = [
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]
# P3B.8: pandas 2.3.x and 3.x both give the golden schedule outputs (P1.7 pinned 2.3.3 because
# the micro schedule failed on pandas 3). The CI job `reference` keeps 2.3.3 through
# ci/constraints-pandas2.txt, because the original IPD scripts still need pandas 2.
schedule = [
    "pandas>=2.3.3,<4",
    "numpy==2.3.5",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]

[project.scripts]
concho = "engines.cli:main"
concho-schedule = "engines.schedule.cli:main"
concho-stv = "engines.stv.cli:main"
concho-tvd = "engines.tvd.cli:main"

[project.urls]
Repository = "https://github.com/mxngl/concho"

# src-less layout: only the `engines` and `dashboards` packages are importable.
[tool.setuptools.packages.find]
include = ["engines", "engines.*", "dashboards", "dashboards.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Verbatim copy of the AutoTVD HTML f-string (P1.3); replaced by a static page in P7.1.
"dashboards/tvd/legacy_render.py" = ["E501", "W605"]
# P1.7: the schedule engines are kept verbatim from IPD_Challenge@989a6b7 (only paths/CLI
# changed) so the diff against the source stays reviewable; lint cleanup is left for Phase 3B.
"engines/schedule/core/*.py" = ["E501", "I001", "B007", "B023", "B905", "F841"]
"engines/schedule/adapters/**/*.py" = ["E501", "I001", "B007"]
"engines/schedule/viewers/*.py" = ["E501", "I001"]
# Dead code in the original calibrator: save_prefab_mapping() uses an undefined constant and
# is never called (see engines/schedule/README.md, "Findings").
"engines/schedule/core/takt_zones.py" = ["E501", "I001", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["engines", "dashboards", "check_forbidden", "export_config_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
