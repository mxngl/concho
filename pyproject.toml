[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concho"
version = "0.0.0"
description = "AI project agent and TVD/STV/schedule engines for AEC Global Teamwork teams (prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Nagel" },
    { name = "Ashmitha Jaysi Sivakumar" },
]
# No license declared yet: decision D4 is pending (see docs/decisions.md).
# P3.1: pydantic for the project_config schema (engines/common/config.py).
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    # P5.4: the data API and its tests (TestClient needs httpx2 with this starlette).
    "concho[api]",
    "httpx2==2.13.0",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    # P5.2: tests/pipeline/ parses the team workflow template (pipeline.yml).
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]
# P5.3/P5.4: the local data API (`concho-api serve`); ingest and queries need only the stdlib.
api = [
    "fastapi==0.136.0",
    "uvicorn==0.53.0",
]
stv = [
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]
# P3B.8: pandas 2.3.x and 3.x both give the golden schedule outputs (P1.7 pinned 2.3.3 because
# the micro schedule failed on pandas 3). The CI job `reference` keeps 2.3.3 through
# ci/constraints-pandas2.txt, because the original IPD scripts still need pandas 2.
schedule = [
    "pandas>=2.3.3,<4",
    "numpy==2.3.5",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",
]

[project.scripts]
concho = "engines.cli:main"
concho-api = "engines.api.cli:main"
concho-schedule = "engines.schedule.cli:main"
concho-stv = "engines.stv.cli:main"
concho-tvd = "engines.tvd.cli:main"

[project.urls]
Repository = "https://github.com/mxngl/concho"

# src-less layout: only the `engines` and `dashboards` packages are importable.
[tool.setuptools.packages.find]
include = ["engines", "engines.*", "dashboards", "dashboards.*"]

# P5.2: data files the engines read at runtime, so a non-editable install (the team pipeline's
# `pip install "concho[stv] @ git+…@vX.Y.Z"`) has them too. Without this the wheel has no CSVs.
[tool.setuptools.package-data]
"engines.common" = ["*.csv"]
# P7: the static dashboards (HTML/CSS/JS) that `run_pipeline.py site` copies into the team site.
# (explicit globs: the site has one level of page folders and a flat assets folder.)
dashboards = ["site/*.html", "site/*/*.html", "site/assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Verbatim copy of the AutoTVD HTML f-string (P1.3); kept as tvd/legacy.html for one release
# after the static TVD page of P7.1, then removed.
"dashboards/tvd/legacy_render.py" = ["E501", "W605"]
# P7.2: the invented catalog table is one row per line (wide on purpose).
"tests/site/stv_fixture.py" = ["E501"]
# P1.7: the schedule engines are kept verbatim from IPD_Challenge@989a6b7 (only paths/CLI
# changed) so the diff against the source stays reviewable; lint cleanup is left for Phase 3B.
"engines/schedule/core/*.py" = ["E501", "I001", "B007", "B023", "B905", "F841"]
"engines/schedule/adapters/**/*.py" = ["E501", "I001", "B007"]
"engines/schedule/viewers/*.py" = ["E501", "I001"]
# Dead code in the original calibrator: save_prefab_mapping() uses an undefined constant and
# is never called (see engines/schedule/README.md, "Findings").
"engines/schedule/core/takt_zones.py" = ["E501", "I001", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["engines", "dashboards", "check_forbidden", "export_config_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
